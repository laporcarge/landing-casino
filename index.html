  <link rel="shortcut icon" href="img/logo%20casss.png" type="image/x-icon" />

  <!-- Meta Pixel Code -->

  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      text-align: center;
      background-color: #000;
      padding: 20px;
    }

    .whatsapp-logo {
      width: 40px;
      vertical-align: middle;
    }

    h1 {
      color: #25D366;
      font-size: 2rem;
      margin: 10px 0;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid #8A2BE2;
      margin: 20px auto;
      object-fit: cover;
      background-color: #fff;
    }

    .title {
      font-weight: 700;
      font-size: 1.5rem;
      color: #8A2BE2;
    }

    .subtitle {
      margin: 5px 0;
      font-size: 1rem;
    }

    .cta-button {
      display: inline-block;
      margin: 20px auto;
      padding: 15px 25px;
      background: linear-gradient(90deg, #00c853, #00e676);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      box-shadow: 0 0 10px #00e676;
      text-decoration: none;
      cursor: pointer;
    }

    .cta-button:hover {
      transform: scale(1.05);
      background-color: #1ebc5a;
    }
  </style>
</head>

<body>

  <h1>WhatsApp</h1>

  <div class="title">RED EMPIRE</div>
  <div class="subtitle">Bono de bienvenida (CON CARGA)</div>

  <a class="cta-button" id="btn-wa" href="https://wa.me/5493518055964">
    ¡CREAR USUARIO AHORA!
  </a>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const trigger = document.getElementById("btn-wa");

      if (trigger) {
        trigger.addEventListener("click", function (e) {

          // 🔥 EVENTO CONTACT (LO IMPORTANTE)
          if (typeof fbq !== 'undefined') {
            fbq('track', 'Contact');
          }

          const base = trigger.getAttribute('href') || '';
          const joiner = base.includes('?') ? '&' : '?';
          const url = base + joiner + 'text=' + encodeURIComponent('Hola, quiero crear mi usuario');

          e.preventDefault();
          window.open(url, '_blank');
        });
      }
    });
  </script>

</body>
</html>
